global:
  resolve_timeout: 5m

route:
  receiver: ai-sre
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 30m

receivers:
  - name: ai-sre
    webhook_configs:
      - url: http://ai-sre-engine:5000/webhook  # Make sure this container name matches
        send_resolved: true
        timeout: 30s  
