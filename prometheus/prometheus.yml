version: '3.3'

services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'  
    restart: unless-stopped
    volumes: 
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
    networks:
      - monitoring    
volumes:
  prom_data:      

networks:
  monitoring:
    external: true
